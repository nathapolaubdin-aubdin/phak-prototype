name: Deploy to GitHub Pages

# Manual only: GitHub Pages needs a public repo (or a paid plan for private repos).
# Once Pages is enabled in Settings > Pages (Source: GitHub Actions), run this
# workflow from the Actions tab, or change the trigger back to `push` on main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workspace
      - id: deployment
        uses: actions/deploy-pages@v4
