name: Deploy to GitHub Pages

# Publishes ./workspace (static site, no build) to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages caches files for 10 minutes, so add the commit SHA to local script/style
      # URLs: each deploy gets fresh URLs and testers never run stale JS/CSS.
      - name: Prepare site (cache-bust assets)
        run: |
          cp -r workspace _site
          rm -rf _site/.claude
          sed -i -E "s#(src|href)=\"((scripts|styles)/[^\"]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/index.html
          grep -c "?v=" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
